name: _tmp action cache test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p /tmp/sample
          cat > /tmp/sample/s.c <<'EOF'
          struct Padded { char a; double b; char c; };
          EOF
      - uses: ./
        with:
          path: /tmp/sample/s.c
          output-format: human
          fail-on-severity: none
          padlock-version: '0.12.0'
