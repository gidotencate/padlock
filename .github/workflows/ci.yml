name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # nextest runs each test in its own process (catches cross-test state
      # leakage that libtest's shared-process threading can mask — relevant
      # here since several tests, e.g. padlock-core's Config::for_path,
      # walk the real filesystem) and schedules across every test binary in
      # the workspace at once rather than one crate at a time. It doesn't
      # run doctests, so those still need a separate cargo test pass.
      - run: cargo nextest run --workspace
      - run: cargo test --doc --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings

  semver:
    name: SemVer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags to resolve the baseline rev below
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      # Compares the current public API of the four library crates against
      # the last tagged release — catching an accidental breaking change
      # (removed/renamed pub item, changed signature) before it ships,
      # rather than after someone's build breaks downstream. Scoped to the
      # crates with a lib target; padlock-cli and padlock-lsp are bin-only
      # (no public API to check) and padlock-macros is a proc-macro crate
      # (fixed TokenStream-in/TokenStream-out signature, nothing for this
      # tool to meaningfully diff). Uses the last git tag as the baseline,
      # not crates.io: cargo-semver-checks is already 0.x-aware (it applies
      # Cargo's own 0.x compatibility rules automatically), and comparing
      # against the last release is the useful check regardless of
      # publish status — it tells you before the *next* release whether
      # it needs a version bump, which is exactly when you want to know.
      - name: Check for breaking API changes since the last release
        run: |
          set -euo pipefail
          BASELINE=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$BASELINE" ]; then
            echo "No previous tag found; skipping SemVer check."
            exit 0
          fi
          echo "Comparing current API against $BASELINE"
          cargo semver-checks check-release \
            --baseline-rev "$BASELINE" \
            -p padlock-core -p padlock-source -p padlock-dwarf -p padlock-output
