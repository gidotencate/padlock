name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g. v0.10.6)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Create the GitHub release once, before any build jobs run.
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Extracts this release's own section from CHANGELOG.md (between its
      # "## [X.Y.Z]" heading and the next one) so the release notes aren't
      # just the bare tag name with an empty body — the content already
      # exists in the changelog, this just reuses it instead of leaving
      # softprops/action-gh-release to either generate a raw commit-list or
      # nothing at all.
      - name: Extract changelog section for this release
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (found) exit
              if (index($0, ver) > 0) { found=1 }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION" > /tmp/release-notes.md
          fi
      - name: Create GitHub release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: padlock ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: padlock
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: padlock
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: padlock
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: padlock
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: padlock.exe
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} -p padlock-cli -p padlock-lsp

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p padlock-cli -p padlock-lsp

      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf padlock-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz padlock cargo-padlock padlock-lsp
          mv padlock-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz $GITHUB_WORKSPACE/

      - name: Package (Windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path padlock.exe, cargo-padlock.exe, padlock-lsp.exe -DestinationPath $env:GITHUB_WORKSPACE/padlock-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: padlock-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive }}

  # Builds the VS Code extension .vsix and attaches it to the GitHub release
  # as a downloadable asset. This does NOT publish to the Marketplace —
  # `vsce publish` needs an Azure DevOps PAT, and PAT-based publishing is
  # currently broken on the Marketplace side (Azure AD auth rejects it).
  # Until that's fixed upstream, publish manually: download the .vsix from
  # this release and upload it through the Marketplace web UI at
  # https://marketplace.visualstudio.com/manage (Edit extension → Update →
  # browse to the .vsix) — that path doesn't need a PAT. See
  # docs/publishing.md for the full manual publish steps.
  build-vscode-extension:
    name: Build VS Code extension (.vsix)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx vsce package --out padlock-${{ env.RELEASE_TAG }}.vsix

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: editors/vscode/padlock-${{ env.RELEASE_TAG }}.vsix
